name: Daily market monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - run: python scripts/update_daily.py
      - run: |
          git config user.name "quant-forward-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Update daily market monitor"
          git push
